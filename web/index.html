<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"/>
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png"/>
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0">
    
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- PWA / iOS Install Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Canverse">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">

    <meta name="description" content="Personal portfolio and trade tracking across multiple portfolios and currencies."/>
    <meta name="keywords" content="portfolio tracker, trade journal, positions, realized P&amp;L, Canverse"/>
    <meta name="author" content="Canverse"/>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website"/>
    <meta property="og:url" content="https://borsa.canverse.dev/"/>
    <meta property="og:title" content="Canverse"/>
    <meta property="og:description" content="Personal portfolio and trade tracking across multiple portfolios and currencies."/>
    <meta property="og:image" content="https://borsa.canverse.dev/assets/logo.png"/>

    <meta name="twitter:card" content="summary"/>
    <meta name="twitter:url" content="https://borsa.canverse.dev/"/>
    <meta name="twitter:title" content="Canverse"/>
    <meta name="twitter:description" content="Personal portfolio and trade tracking across multiple portfolios and currencies."/>
    <meta name="twitter:image" content="https://borsa.canverse.dev/assets/logo.png"/>

    <!-- Canonical URL -->
    <link rel="canonical" href="https://borsa.canverse.dev/"/>

    <!-- iOS specific meta tags -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>

    <title>Canverse</title>
    <!-- font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap"
          rel="stylesheet">
</head>
