rsa:
  private-key: classpath:certs/private.pem # TODO: need to move to env in production
  public-key: classpath:certs/public.pem

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:google_client_id_here}
    client-secret: ${GOOGLE_CLIENT_SECRET:google_client_secret_here}
            

app:
  forex-rate-api:
    base-url: 'https://api.forexrateapi.com'
    api-key: ${FOREX_RATE_API_KEY:your_api_key_here}
  gemini-api-key: ${GEMINI_API_KEY:your_gemini_api_key_here}

market-updater:
  providers:
    tradingview:
      enabled: true
    sabah:
      enabled: true
  markets:
    bist:
      enabled: true
      cron: "0 */5 10-18 * * MON-FRI"
      discovery-cron: "0 30 9 * * MON-FRI"
      timezone: "Europe/Istanbul"
      min-quotes: 100

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

spring:
  application:
    name: Finance

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stocks}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        generate_statistics: false
        fail_on_pagination_over_collection_fetch: true
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
    show-sql: false

  flyway:
    locations: classpath:db/migrations
    default-schema: public
    baseline-on-migrate: false
    out-of-order: false
    validate-on-migrate: true
    clean-disabled: true

  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:5}
      thread-name-prefix: "scheduler-"
    execution:
      pool:
        core-size: ${EXECUTOR_CORE_SIZE:5}
        max-size: ${EXECUTOR_MAX_SIZE:10}
        queue-capacity: ${EXECUTOR_QUEUE_SIZE:100}
      thread-name-prefix: "async-"

mybatis:
  mapper-locations: classpath:mappers/**/*.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true


logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(%esb(%X{requestId})){magenta}%clr(%logger{0}){cyan} %clr(-){faint} %m%clr(%replace( %kvp{NONE}){'^ $', ''}){faint}%n%wEx"
  level:
    root: INFO
    dev.canverse: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.stat: WARN
    org.springdoc: WARN
