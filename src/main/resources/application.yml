spring:
  application:
    name: stocks
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/extreme_accounting}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      auto-commit: false
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        generate_statistics: false
  flyway:
    enabled: true
    baseline-on-migrate: false
  sql:
    init:
      mode: never
  mvc:
    problemdetails:
      enabled: true

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health
